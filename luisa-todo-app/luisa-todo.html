<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141821">
<title>Luisa Todo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#141821;--bg2:#1c2030;--bg3:#232840;--bg4:#2a3050;
--text:#e8e6e1;--muted:#9a968e;--dim:#5e5a52;
--accent:#c9a84c;--glow:rgba(201,168,76,.15);
--border:#2e3348;--ok:#66bb6a;--danger:#ef5350;
--r:14px;--rr:20px;--pill:50px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:500px;margin:0 auto;position:relative}

/* Tabs */
.tabs{display:flex;border-top:1px solid var(--border);background:var(--bg2);padding:6px 0 max(env(safe-area-inset-bottom),20px);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;cursor:pointer;transition:.2s;-webkit-user-select:none;user-select:none}
.tab.active{color:var(--accent)}
.tab:not(.active){color:var(--dim)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:10px;font-weight:600}

/* Screens */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen{scrollbar-width:none}
.screen-header{padding:50px 6px 12px;position:sticky;top:0;background:var(--bg);z-index:10}
.screen-title{font-size:26px;font-weight:700;color:var(--accent)}
.screen-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* Quick Add */
.quick-add{display:flex;gap:8px;margin-bottom:8px}
.quick-input{flex:1;height:48px;background:var(--bg3);border:none;border-radius:var(--r);padding:0 14px;color:var(--text);font-size:15px;outline:none}
.quick-input::placeholder{color:var(--dim)}
.add-btn{width:48px;height:48px;border-radius:var(--r);background:var(--accent);border:none;color:var(--bg);font-size:22px;font-weight:700;cursor:pointer}
.more-btn{width:48px;height:48px;border-radius:var(--r);background:var(--bg3);border:none;color:var(--muted);font-size:18px;font-weight:700;cursor:pointer}

/* Auto hint */
.auto-hint{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:var(--glow);border-radius:var(--pill);font-size:12px;color:var(--accent);margin-bottom:8px;transition:.3s}
.auto-hint .dot{width:8px;height:8px;border-radius:4px}

/* Pills */
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 14px;border-radius:var(--pill);border:2px solid var(--border);background:var(--bg3);font-size:13px;color:var(--text);cursor:pointer;flex-shrink:0;transition:.2s;display:flex;align-items:center;gap:5px}
.pill.active{border-color:var(--accent);background:var(--glow);color:var(--accent);font-weight:600}
.pill .dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}

/* Filter row */
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border-radius:var(--pill);background:var(--bg3);border:none;font-size:12px;color:var(--muted);cursor:pointer;transition:.2s}
.filter-btn.active{background:var(--glow);border:1px solid var(--accent);color:var(--accent);font-weight:600}

/* Task Card */
.task{display:flex;background:var(--bg2);border-radius:var(--r);border-left:4px solid var(--dim);padding:12px;margin-bottom:8px;transition:.3s;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.task.done{opacity:.4}
.task:hover{background:var(--bg4)}
.check-wrap{min-width:40px;display:flex;align-items:flex-start;justify-content:center;padding-top:2px}
.checkbox{width:24px;height:24px;border-radius:12px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.checkbox.checked{background:var(--accent);border-color:var(--accent)}
.checkbox.checked::after{content:'✓';color:var(--bg);font-size:13px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:5px}
.task.done .task-title{text-decoration:line-through;color:var(--dim)}
.task-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;color:var(--muted);background:var(--bg3)}
.badge.overdue{background:rgba(239,83,80,.15);color:var(--danger)}
.task-desc{font-size:12px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-del{padding:4px 8px;cursor:pointer;color:var(--dim);font-size:14px;opacity:0;transition:.2s;align-self:flex-start}
.task:hover .task-del{opacity:1}

/* Empty */
.empty{text-align:center;margin-top:60px}
.empty-icon{font-size:48px;margin-bottom:10px}
.empty-text{font-size:18px;font-weight:600}
.empty-sub{font-size:13px;color:var(--dim);margin-top:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border-radius:var(--rr) var(--rr) 0 0;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:.4s cubic-bezier(.2,.9,.3,1)}
.modal-bg.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:700;color:var(--accent)}
.modal-close{font-size:20px;color:var(--dim);cursor:pointer;padding:8px}
.form-label{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.form-input{width:100%;background:var(--bg3);border:none;border-radius:8px;padding:12px;color:var(--text);font-size:15px;outline:none}
.form-input::placeholder{color:var(--dim)}
.form-textarea{height:70px;resize:none}
.prio-row{display:flex;gap:8px}
.prio-opt{flex:1;padding:10px;border-radius:8px;background:var(--bg3);text-align:center;font-size:13px;cursor:pointer;transition:.2s;border:2px solid transparent}
.prio-opt.active{background:var(--glow);border-color:var(--accent)}
.save-btn{width:100%;padding:14px;border-radius:var(--r);background:var(--accent);border:none;color:var(--bg);font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.save-btn:active{transform:scale(.97)}

/* Shop */
.shop-section-title{font-size:12px;font-weight:600;color:var(--muted);padding:8px 0 4px}
.shop-item{display:flex;align-items:center;background:var(--bg2);border-radius:8px;padding:8px 10px;margin-bottom:4px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.shop-item.checked{opacity:.35}
.shop-name{flex:1;font-size:14px}
.shop-item.checked .shop-name{text-decoration:line-through;color:var(--dim)}
.shop-qty{font-size:12px;color:var(--muted)}
.shop-del{cursor:pointer;color:var(--dim);padding:4px}
.stamm-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stamm-btn{padding:7px 12px;border-radius:var(--pill);background:var(--bg3);border:none;font-size:12px;color:var(--text);cursor:pointer}
.stamm-btn.used{opacity:.3;text-decoration:line-through}
.action-row{display:flex;gap:8px;margin-bottom:10px}
.action-btn{padding:7px 12px;border-radius:var(--pill);background:var(--bg3);border:none;font-size:12px;color:var(--muted);cursor:pointer}

/* Pack */
.template-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:var(--r);padding:18px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.template-card:hover{background:var(--bg4)}
.template-icon{font-size:38px}
.template-name{font-size:17px;font-weight:600}
.template-info{font-size:12px;color:var(--muted);margin-top:2px}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:.3s}
.pack-section{margin-bottom:14px}
.pack-section-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.pack-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:8px;padding:10px;margin-bottom:3px;cursor:pointer;min-height:44px}
.pack-item.checked{opacity:.4}
.pack-item.checked .pack-text{text-decoration:line-through;color:var(--dim)}
.pack-text{font-size:14px}
.done-banner{background:var(--glow);border-radius:var(--r);padding:14px;text-align:center;font-size:16px;font-weight:600;color:var(--accent);margin-bottom:12px}
.reset-btn{width:100%;padding:10px;border-radius:8px;background:var(--bg3);border:none;font-size:13px;color:var(--muted);cursor:pointer;margin-top:8px}

/* Stats */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.stat-num{font-size:26px;font-weight:700}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px}
.section-card{background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.section-title{font-size:15px;font-weight:600;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-emoji{font-size:16px;width:28px;text-align:center}
.bar-track{flex:1;height:16px;background:var(--bg3);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:.3s}
.bar-val{font-size:11px;color:var(--muted);width:55px;text-align:right}
.week-chart{display:flex;justify-content:space-around;align-items:flex-end;height:120px;padding-top:16px}
.week-col{display:flex;flex-direction:column;align-items:center;flex:1}
.week-val{font-size:11px;color:var(--muted);margin-bottom:4px}
.week-bar{width:20px;border-radius:5px;background:var(--accent);min-height:4px;transition:.3s}
.week-day{font-size:11px;color:var(--dim);margin-top:4px}
.prio-cards{display:flex;gap:8px}
.prio-card{flex:1;background:var(--bg3);border-radius:8px;border-left:3px solid;padding:10px;text-align:center}
.prio-num{font-size:22px;font-weight:700}
.prio-label{font-size:10px;color:var(--muted)}
.insight{background:var(--glow);border-radius:var(--r);border:1px solid rgba(201,168,76,.25);padding:16px;text-align:center;font-size:14px;color:var(--accent);line-height:1.5}

/* Profile */
.profile-card{text-align:center;background:var(--bg2);border-radius:var(--r);padding:24px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.avatar{width:72px;height:72px;border-radius:36px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:32px;font-weight:700;color:var(--bg)}
.profile-name{font-size:22px;font-weight:700}
.profile-sub{font-size:13px;color:var(--muted);margin-top:4px}
.cat-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.cat-dot{width:12px;height:12px;border-radius:6px;flex-shrink:0}
.mgmt-btn{width:100%;padding:10px;border-radius:8px;background:var(--bg3);border:none;font-size:13px;color:var(--muted);cursor:pointer;margin-top:6px}
.danger-btn{width:100%;padding:10px;border-radius:8px;background:rgba(239,83,80,.1);border:none;font-size:13px;color:var(--danger);cursor:pointer;margin-top:8px}
.learned-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.learned-chip{padding:3px 10px;border-radius:var(--pill);background:var(--bg3);font-size:11px}

/* Cat editor */
.cat-edit-row{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:8px;margin-bottom:6px}
.emoji-btn{width:38px;height:38px;border-radius:19px;background:var(--bg2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.cat-name-input{flex:1;background:transparent;border:none;color:var(--text);font-size:15px;outline:none}
.color-btn{width:28px;height:28px;border-radius:14px;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.del-cat{padding:4px 8px;cursor:pointer;color:var(--dim);font-size:14px}
.picker-grid{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg3);border-radius:8px;padding:8px;margin-bottom:6px}
.picker-item{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:20px}
.picker-item:hover{background:var(--bg4)}
.color-grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin-bottom:6px}
.color-swatch{width:32px;height:32px;border-radius:16px;cursor:pointer;border:3px solid transparent}
.color-swatch.sel{border-color:var(--text)}
.add-cat-btn{width:100%;padding:10px;border:2px dashed var(--border);border-radius:8px;background:none;font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:10px}

/* Back btn */
.back-btn{color:var(--accent);cursor:pointer;font-size:15px;margin-bottom:6px;display:inline-block}
</style>
</head>
<body>
<div class="app">
  <div id="screen" class="screen"></div>
  <div class="tabs">
    <div class="tab active" data-tab="tasks"><div class="tab-icon">☑️</div><div class="tab-label">Aufgaben</div></div>
    <div class="tab" data-tab="shop"><div class="tab-icon">🛒</div><div class="tab-label">Einkaufen</div></div>
    <div class="tab" data-tab="pack"><div class="tab-icon">🧳</div><div class="tab-label">Packen</div></div>
    <div class="tab" data-tab="stats"><div class="tab-icon">📊</div><div class="tab-label">Statistik</div></div>
    <div class="tab" data-tab="profile"><div class="tab-icon">🧘</div><div class="tab-label">Ich</div></div>
  </div>
</div>
<div id="modal" class="modal-bg"></div>

<script>
// ========== STATE ==========
const STORE_KEY='luisa_app_v2';
const DEFAULT_CATS={rossbacher:{emoji:'🏢',color:'#4a90d9',name:'Rossbacher'},ki:{emoji:'🤖',color:'#9b6dd7',name:'KI & Lernen'},kreativ:{emoji:'📖',color:'#c9a84c',name:'Kreativ'},familie:{emoji:'👨‍👩‍👧',color:'#d9739e',name:'Familie'},persoenlich:{emoji:'🧘',color:'#4ecdc4',name:'Persönlich'}};
const AUTO_KW={rossbacher:['rossbacher','büro','office','meeting','chef','kollege','kollegin','arbeit','projekt','deadline','präsentation','email','mail','angebot','kunde','kundin','rechnung','lieferung','firma','geschäft','call','zoom','teams','anruf','besprechung','kunden','auftrag','lager','versand','buchhaltung','steuer'],ki:['ki','ai','python','code','programmier','lernen','kurs','tutorial','claude','chatgpt','machine learning','neural','daten','api','prompt','model','training','chatbot','algorithmus','deep learning','notebook','gpt','llm','automation','bot'],kreativ:['schreib','buch','lesen','blog','zeichn','malen','foto','video','musik','design','kreativ','gedicht','tagebuch','journal','roman','text','artikel','notiz','brainstorm','idee','skizze','poesie','podcast','youtube','content','essay'],familie:['letizia','mama','papa','schwester','bruder','oma','opa','kindergarten','schule','kind','kinder','familie','eltern','geburtstag','gemeinsam','spielen','vorlesen','basteln','kochen zusammen','ausflug','zoo','spielplatz','kinderarzt','kita','abholen','wochenende','großeltern'],persoenlich:['yoga','meditation','sport','laufen','gym','fitness','arzt','termin','zahnarzt','friseur','wohnung','putzen','waschen','kochen','einkauf','staubsaugen','aufräumen','schlaf','spazier','natur','garten','balkon','apotheke','therapie','massage','schwimmen','radfahren','wandern','wellness','entspann']};
const SHOP_CATS={obst:{label:'🍎 Obst & Gemüse',kw:['apfel','äpfel','birne','banane','orange','tomate','gurke','salat','kartoffel','zwiebel','paprika','zucchini','karotte','brokkoli','spinat','trauben','erdbeeren','avocado','mango','kiwi','ananas','zitrone','knoblauch','pilze','champignons']},milch:{label:'🥛 Milchprodukte',kw:['milch','butter','käse','joghurt','sahne','quark','frischkäse','schmand','skyr','mozzarella','parmesan','gouda','buttermilch']},fleisch:{label:'🥩 Fleisch & Fisch',kw:['fleisch','huhn','hähnchen','rind','schwein','lachs','fisch','wurst','schinken','speck','hack','salami','thunfisch','garnelen','pute']},brot:{label:'🍞 Brot & Backwaren',kw:['brot','brötchen','semmel','toast','croissant','brezel','kuchen','mehl','hefe','backpulver']},trocken:{label:'🥫 Trockenwaren',kw:['nudeln','reis','pasta','spaghetti','linsen','bohnen','kichererbsen','haferflocken','müsli','zucker','salz','pfeffer','öl','olivenöl','essig','senf','ketchup','dose','nüsse','mandeln','couscous']},haushalt:{label:'🧴 Haushalt',kw:['spülmittel','waschmittel','toilettenpapier','küchenrolle','seife','shampoo','duschgel','zahnpasta','deo','creme','taschentücher','müllbeutel','schwamm','reiniger']},tk:{label:'❄️ Tiefkühl',kw:['tiefkühl','eis','pizza','pommes','tk-','gefrorene','fischstäbchen']},sonstiges:{label:'📦 Sonstiges',kw:[]}};
const STAMM=['Milch','Brot','Butter','Eier','Bananen','Äpfel','Nudeln','Reis','Joghurt','Käse','Tomaten','Gurke','Kartoffeln','Zwiebeln','Haferflocken','Olivenöl'];
const PACK_TPL=[{id:'urlaub',icon:'🧳',name:'Urlaub',sections:{'Kleidung':['T-Shirts','Hosen','Unterwäsche','Socken','Pyjama','Jacke','Badekleidung','Schuhe'],'Hygiene':['Zahnbürste','Zahnpasta','Shampoo','Deo','Sonnencreme','Medikamente'],'Dokumente':['Reisepass/Ausweis','Versicherungskarte','Buchungsbestätigungen'],'Technik':['Ladekabel','Powerbank','Kopfhörer'],'Für Letizia':['Kuscheltier','Malbuch','Snacks','Wechselkleidung']}},{id:'ausflug',icon:'🏔️',name:'Tagesausflug',sections:{'Essentials':['Rucksack','Wasserflasche','Snacks','Sonnencreme','Sonnenbrille','Erste-Hilfe-Set','Taschentücher','Handy + Ladekabel'],'Je nach Wetter':['Regenjacke','Mütze','Handschuhe','Sonnenhut'],'Für Letizia':['Wechselkleidung','Snacks','Trinkflasche','Spielzeug']}},{id:'kindergarten',icon:'🎒',name:'Kindergarten Letizia',sections:{'Jeden Tag':['Rucksack','Jause/Brotdose','Trinkflasche','Wechselkleidung','Hausschuhe'],'Bei Bedarf':['Regenkleidung','Sonnenhut','Gummistiefel','Kuscheltier']}}];
const CAT_EMOJIS=['🏢','🤖','📖','👨‍👩‍👧','🧘','💼','🎯','🏠','💪','🎨','📚','💡','🌱','🎵','🏋️','🍳','✈️','💰','❤️','🎓','🔧','📱','🛒','⭐','🌍','🧠','📝','🎮','🐾','🌸'];
const CAT_COLORS=['#4a90d9','#9b6dd7','#c9a84c','#d9739e','#4ecdc4','#ef5350','#66bb6a','#ff7043','#ab47bc','#5c6bc0','#26a69a','#ffa726','#8d6e63','#78909c','#ec407a','#7e57c2'];

let S;function load(){try{const d=localStorage.getItem(STORE_KEY);S=d?{...def(),...JSON.parse(d)}:def()}catch(e){S=def()}}
function def(){return{tasks:[],shopping:[],cats:null,learned:{},streak:{current:0,lastDate:''},log:{},mood:{}}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(S))}
function cats(){return(S.cats&&Object.keys(S.cats).length)?S.cats:DEFAULT_CATS}
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}

// Auto-detect
function detect(text){
  const l=text.toLowerCase();
  for(const[w,c]of Object.entries(S.learned||{})){if(l.includes(w.toLowerCase()))return{cat:c,conf:'learned',kw:w}}
  const sc={};
  for(const[c,kws]of Object.entries(AUTO_KW)){sc[c]=0;for(const k of kws){if(l.includes(k))sc[c]+=k.length}}
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  if(sorted.length&&sorted[0][1]>0)return{cat:sorted[0][0],conf:sorted[0][1]>8?'high':'low'};
  return null;
}
function detectShop(n){const l=n.toLowerCase();for(const[c,d]of Object.entries(SHOP_CATS)){if(d.kw.some(k=>l.includes(k)))return c}return'sonstiges'}
function learnCorrection(title,nc,oc){if(nc===oc)return;const ws=title.toLowerCase().split(/\s+/).filter(w=>w.length>=3);const allKw=Object.values(AUTO_KW).flat();ws.forEach(w=>{if(!allKw.includes(w))S.learned[w]=nc});save()}

// ========== RENDER ==========
let curTab='tasks';
let filterCat='',filterPrio='',showDone=false;
let packTpl=null,packChecked={};

const $=id=>document.getElementById(id);
const screen=$('screen');
const modal=$('modal');

function render(){
  if(curTab==='tasks')renderTasks();
  else if(curTab==='shop')renderShop();
  else if(curTab==='pack')renderPack();
  else if(curTab==='stats')renderStats();
  else renderProfile();
}

// TASKS
function renderTasks(){
  const c=cats();
  const open=S.tasks.filter(t=>!t.done).length;
  const today=new Date().toISOString().split('T')[0];
  const todayDone=S.tasks.filter(t=>t.done&&t.doneDate&&t.doneDate.startsWith(today)).length;
  const tasks=S.tasks.filter(t=>{
    if(!showDone&&t.done)return false;
    if(filterCat&&t.cat!==filterCat)return false;
    if(filterPrio&&t.prio!==filterPrio)return false;
    return true;
  });

  let h=`<div class="screen-header"><div class="screen-title">Hallo Luisa ✨</div><div class="screen-sub">${open} offen · ${todayDone} heute erledigt</div></div>`;
  h+=`<div class="quick-add"><input class="quick-input" id="qi" placeholder="Neue Aufgabe eingeben..." autocomplete="off"><button class="add-btn" id="qa">+</button><button class="more-btn" id="qm">⋯</button></div>`;
  h+=`<div id="ahint" class="auto-hint" style="display:none"></div>`;
  h+=`<div class="pills"><div class="pill ${!filterCat?'active':''}" data-fc="">Alle</div>`;
  for(const[k,v]of Object.entries(c)){h+=`<div class="pill ${filterCat===k?'active':''}" data-fc="${k}"><div class="dot" style="background:${v.color}"></div>${v.emoji} ${v.name}</div>`}
  h+=`</div>`;
  h+=`<div class="filters">`;
  for(const[k,l]of [['','Alle'],['high','🔴 Hoch'],['medium','🟡 Mittel'],['low','🟢 Niedrig']]){h+=`<button class="filter-btn ${filterPrio===k?'active':''}" data-fp="${k}">${l}</button>`}
  h+=`<button class="filter-btn ${showDone?'active':''}" id="ftd">✓ Erledigt</button></div>`;

  if(!tasks.length){h+=`<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">Alles erledigt!</div><div class="empty-sub">Oder füge eine neue Aufgabe hinzu</div></div>`}
  else{tasks.forEach(t=>{const cat=c[t.cat];const col=cat?cat.color:'#5e5a52';const od=t.due&&t.due<today&&!t.done;
    h+=`<div class="task ${t.done?'done':''}" style="border-left-color:${col}" data-tid="${t.id}">`;
    h+=`<div class="check-wrap"><div class="checkbox ${t.done?'checked':''}" data-ck="${t.id}"></div></div>`;
    h+=`<div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-badges">`;
    if(cat)h+=`<span class="badge" style="background:${col}20;color:${col}">${cat.emoji} ${cat.name}</span>`;
    h+=`<span class="badge">${t.prio==='high'?'🔴':t.prio==='medium'?'🟡':'🟢'}</span>`;
    if(t.due)h+=`<span class="badge ${od?'overdue':''}">${od?'⚠️ ':'📅 '}${fmtDate(t.due)}</span>`;
    if(t.quickTask)h+=`<span class="badge" style="background:rgba(201,168,76,.15)">⚡ 2min</span>`;
    h+=`</div>`;
    if(t.desc)h+=`<div class="task-desc">${esc(t.desc)}</div>`;
    h+=`</div><div class="task-del" data-del="${t.id}">✕</div></div>`;
  })}
  screen.innerHTML=h;

  // Events
  const qi=$('qi');
  qi.addEventListener('input',e=>{
    const v=e.target.value;const ah=$('ahint');
    if(v.length<3){ah.style.display='none';return}
    const r=detect(v);
    if(r&&c[r.cat]){ah.style.display='inline-flex';ah.innerHTML=`<div class="dot" style="background:${c[r.cat].color}"></div>${c[r.cat].emoji} ${c[r.cat].name}${r.conf==='learned'?' (gelernt)':''}`}
    else ah.style.display='none';
  });
  qi.addEventListener('keydown',e=>{if(e.key==='Enter')addQuickTask()});
  $('qa').onclick=addQuickTask;
  $('qm').onclick=()=>openTaskForm();
  screen.querySelectorAll('[data-fc]').forEach(p=>p.onclick=()=>{filterCat=p.dataset.fc;render()});
  screen.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{filterPrio=b.dataset.fp;render()});
  $('ftd').onclick=()=>{showDone=!showDone;render()};
  screen.querySelectorAll('[data-ck]').forEach(c=>c.onclick=e=>{e.stopPropagation();toggleTask(c.dataset.ck)});
  screen.querySelectorAll('[data-tid]').forEach(t=>t.onclick=()=>openTaskForm(t.dataset.tid));
  screen.querySelectorAll('[data-del]').forEach(d=>d.onclick=e=>{e.stopPropagation();delTask(d.dataset.del)});
}

function addQuickTask(){
  const qi=$('qi');const v=qi.value.trim();if(!v)return;
  const r=detect(v);const cat=r?r.cat:Object.keys(cats())[0];
  S.tasks.unshift({id:gid(),title:v,desc:'',cat,prio:'medium',due:'',done:false,doneDate:null,quickTask:false,subtasks:[],createdAt:Date.now()});
  save();qi.value='';render();
}

function toggleTask(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  t.done=!t.done;t.doneDate=t.done?new Date().toISOString():null;
  if(t.done){const d=new Date().toISOString().split('T')[0];S.log[d]=(S.log[d]||0)+1}
  save();render();
}

function delTask(id){if(confirm('Aufgabe löschen?')){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}}

function openTaskForm(id){
  const c=cats();const t=id?S.tasks.find(t=>t.id===id):null;
  let h=`<div class="modal" onclick="event.stopPropagation()">`;
  h+=`<div class="modal-header"><div class="modal-title">${t?'Bearbeiten':'Neue Aufgabe'}</div><div class="modal-close" id="mc">✕</div></div>`;
  h+=`<div class="form-label">Titel</div><input class="form-input" id="ft" value="${t?esc(t.title):''}" placeholder="Was steht an?">`;
  h+=`<div class="form-label">Beschreibung</div><textarea class="form-input form-textarea" id="fd" placeholder="Details...">${t?esc(t.desc):''}</textarea>`;
  h+=`<div class="form-label">Kategorie</div><div class="pills" id="fc-pills">`;
  const selCat=t?t.cat:Object.keys(c)[0];
  for(const[k,v]of Object.entries(c)){h+=`<div class="pill ${selCat===k?'active':''}" data-sc="${k}"><div class="dot" style="background:${v.color}"></div>${v.emoji} ${v.name}</div>`}
  h+=`</div>`;
  h+=`<div class="form-label">Priorität</div><div class="prio-row">`;
  const selP=t?t.prio:'medium';
  for(const[k,l]of[['high','🔴 Hoch'],['medium','🟡 Mittel'],['low','🟢 Niedrig']]){h+=`<div class="prio-opt ${selP===k?'active':''}" data-sp="${k}">${l}</div>`}
  h+=`</div>`;
  h+=`<div class="form-label">Fällig am</div><input class="form-input" type="date" id="fdue" value="${t?t.due:''}">`;
  h+=`<button class="save-btn" id="fsave">${t?'✓ Speichern':'+ Hinzufügen'}</button></div>`;
  modal.innerHTML=h;modal.classList.add('show');
  let sCat=selCat,sPrio=selP;

  // Auto-detect while typing title
  const ftInput=$('ft');
  ftInput.addEventListener('input',()=>{
    if(!t&&ftInput.value.length>=3){const r=detect(ftInput.value);if(r){sCat=r.cat;modal.querySelectorAll('[data-sc]').forEach(p=>{p.classList.toggle('active',p.dataset.sc===sCat)})}}
  });
  ftInput.focus();

  $('mc').onclick=closeModal;
  modal.onclick=closeModal;
  modal.querySelectorAll('[data-sc]').forEach(p=>p.onclick=()=>{sCat=p.dataset.sc;modal.querySelectorAll('[data-sc]').forEach(x=>x.classList.toggle('active',x.dataset.sc===sCat))});
  modal.querySelectorAll('[data-sp]').forEach(p=>p.onclick=()=>{sPrio=p.dataset.sp;modal.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('active',x.dataset.sp===sPrio))});
  $('fsave').onclick=()=>{
    const title=$('ft').value.trim();if(!title)return;
    if(t){const oc=t.cat;t.title=title;t.desc=$('fd').value;t.cat=sCat;t.prio=sPrio;t.due=$('fdue').value;learnCorrection(title,sCat,oc)}
    else{S.tasks.unshift({id:gid(),title,desc:$('fd').value,cat:sCat,prio:sPrio,due:$('fdue').value,done:false,doneDate:null,quickTask:false,subtasks:[],createdAt:Date.now()})}
    save();closeModal();render();
  };
}

// SHOPPING
function renderShop(){
  const unc=S.shopping.filter(s=>!s.checked),chk=S.shopping.filter(s=>s.checked);
  let h=`<div class="screen-header"><div class="screen-title">🛒 Einkaufsliste</div><div class="screen-sub">${unc.length} Artikel</div></div>`;
  h+=`<div class="quick-add"><input class="quick-input" id="si" placeholder="Artikel hinzufügen..." autocomplete="off"><button class="add-btn" id="sa">+</button></div>`;
  h+=`<div class="action-row"><button class="action-btn" id="stamm-toggle">⭐ Stammware</button>`;
  if(chk.length)h+=`<button class="action-btn" id="clearchk" style="color:var(--danger)">🗑️ Erledigte löschen</button>`;
  h+=`</div><div id="stamm-area" style="display:none"><div class="stamm-grid">`;
  const inList=S.shopping.filter(s=>!s.checked).map(s=>s.name.toLowerCase());
  STAMM.forEach(n=>{const used=inList.includes(n.toLowerCase());h+=`<button class="stamm-btn ${used?'used':''}" ${used?'disabled':''} data-st="${n}">${n}</button>`});
  h+=`</div></div>`;

  const grouped={};unc.forEach(s=>{if(!grouped[s.cat])grouped[s.cat]=[];grouped[s.cat].push(s)});
  for(const[cat,items]of Object.entries(grouped)){
    h+=`<div class="shop-section-title">${SHOP_CATS[cat]?.label||'📦 Sonstiges'}</div>`;
    items.forEach(s=>{h+=shopItemHTML(s)});
  }
  if(chk.length){
    h+=`<div class="shop-section-title">✓ Erledigt (${chk.length})</div>`;
    chk.forEach(s=>{h+=shopItemHTML(s)});
  }
  if(!S.shopping.length)h+=`<div class="empty"><div class="empty-icon">🛒</div><div class="empty-text">Einkaufsliste ist leer</div></div>`;
  screen.innerHTML=h;

  $('si').addEventListener('keydown',e=>{if(e.key==='Enter')addShopItem($('si').value)});
  $('sa').onclick=()=>addShopItem($('si').value);
  const st=$('stamm-toggle');if(st)st.onclick=()=>{const a=$('stamm-area');a.style.display=a.style.display==='none'?'block':'none'};
  const cc=$('clearchk');if(cc)cc.onclick=()=>{if(confirm(`${chk.length} erledigte löschen?`)){S.shopping=S.shopping.filter(s=>!s.checked);save();render()}};
  screen.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{addShopItem(b.dataset.st)});
  screen.querySelectorAll('[data-sck]').forEach(c=>c.onclick=e=>{e.stopPropagation();const s=S.shopping.find(x=>x.id===c.dataset.sck);if(s){s.checked=!s.checked;save();render()}});
  screen.querySelectorAll('[data-sdel]').forEach(d=>d.onclick=()=>{S.shopping=S.shopping.filter(x=>x.id!==d.dataset.sdel);save();render()});
}
function shopItemHTML(s){return`<div class="shop-item ${s.checked?'checked':''}"><div class="check-wrap"><div class="checkbox ${s.checked?'checked':''}" data-sck="${s.id}"></div></div><div class="shop-name">${esc(s.name)}</div>${s.qty?`<div class="shop-qty">${esc(s.qty)}</div>`:''}<div class="shop-del" data-sdel="${s.id}">✕</div></div>`}
function addShopItem(v){v=v.trim();if(!v)return;let name=v,qty='';const m=v.match(/^(\d+[x]?\s+)/i)||v.match(/(\s+\d+[x]?)$/i);if(m){qty=m[1].trim();name=v.replace(m[0],'').trim()}const cat=detectShop(name);S.shopping.push({id:gid(),name,qty,cat,checked:false});save();render()}

// PACKING
function renderPack(){
  if(!packTpl){
    let h=`<div class="screen-header"><div class="screen-title">🧳 Packlisten</div><div class="screen-sub">Wähle eine Vorlage</div></div>`;
    PACK_TPL.forEach(t=>{const n=Object.values(t.sections).flat().length;h+=`<div class="template-card" data-pt="${t.id}"><div class="template-icon">${t.icon}</div><div><div class="template-name">${t.name}</div><div class="template-info">${n} Artikel</div></div></div>`});
    screen.innerHTML=h;
    screen.querySelectorAll('[data-pt]').forEach(c=>c.onclick=()=>{packTpl=PACK_TPL.find(t=>t.id===c.dataset.pt);packChecked={};render()});
    return;
  }
  const total=Object.values(packTpl.sections).flat().length;
  const done=Object.values(packChecked).filter(Boolean).length;
  let h=`<div class="screen-header"><div class="back-btn" id="pack-back">← Zurück</div><div class="screen-title">${packTpl.icon} ${packTpl.name}</div><div class="screen-sub">${done}/${total} eingepackt</div></div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${(done/total*100)}%"></div></div>`;
  if(done===total&&total>0)h+=`<div class="done-banner">Alles eingepackt! 🎉</div>`;
  for(const[sec,items]of Object.entries(packTpl.sections)){
    h+=`<div class="pack-section"><div class="pack-section-title">${sec}</div>`;
    items.forEach(it=>{const k=sec+'-'+it;const ck=!!packChecked[k];h+=`<div class="pack-item ${ck?'checked':''}" data-pk="${k}"><div class="checkbox ${ck?'checked':''}"></div><div class="pack-text">${it}</div></div>`});
    h+=`</div>`;
  }
  h+=`<button class="reset-btn" id="pack-reset">↺ Alles zurücksetzen</button>`;
  screen.innerHTML=h;
  $('pack-back').onclick=()=>{packTpl=null;render()};
  $('pack-reset').onclick=()=>{packChecked={};render()};
  screen.querySelectorAll('[data-pk]').forEach(i=>i.onclick=()=>{packChecked[i.dataset.pk]=!packChecked[i.dataset.pk];render()});
}

// STATS
function renderStats(){
  const c=cats();const total=S.tasks.length,done=S.tasks.filter(t=>t.done).length,open=total-done;
  const today=new Date().toISOString().split('T')[0];
  const todayDone=S.tasks.filter(t=>t.done&&t.doneDate&&t.doneDate.startsWith(today)).length;
  const streak=S.streak?.current||0;
  const catC={};Object.keys(c).forEach(k=>{catC[k]={open:0,done:0}});
  S.tasks.forEach(t=>{if(!catC[t.cat])catC[t.cat]={open:0,done:0};if(t.done)catC[t.cat].done++;else catC[t.cat].open++});
  const maxCat=Math.max(1,...Object.values(catC).map(v=>v.open+v.done));
  const prio={high:0,medium:0,low:0};S.tasks.filter(t=>!t.done).forEach(t=>prio[t.prio]++);
  const days=['Mo','Di','Mi','Do','Fr','Sa','So'];const now=new Date();const dow=(now.getDay()+6)%7;
  const ws=new Date(now);ws.setDate(now.getDate()-dow);
  const wk=[];let maxD=1;
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);const ds=d.toISOString().split('T')[0];const v=S.log[ds]||0;wk.push(v);if(v>maxD)maxD=v}

  let h=`<div class="screen-header"><div class="screen-title">📊 Statistik</div></div>`;
  h+=`<div class="stat-cards"><div class="stat-card"><div class="stat-num">${todayDone}</div><div class="stat-label">Heute</div></div><div class="stat-card"><div class="stat-num">${open}</div><div class="stat-label">Offen</div></div><div class="stat-card"><div class="stat-num">${done}</div><div class="stat-label">Erledigt</div></div><div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-label">🔥 Streak</div></div></div>`;
  h+=`<div class="section-card"><div class="section-title">Nach Kategorie</div>`;
  for(const[k,v]of Object.entries(c)){const cc=catC[k]||{open:0,done:0};const t=cc.open+cc.done;const w=Math.round(t/maxCat*100);h+=`<div class="bar-row"><div class="bar-emoji">${v.emoji}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${v.color}"></div></div><div class="bar-val">${cc.open} offen</div></div>`}
  h+=`</div>`;
  h+=`<div class="section-card"><div class="section-title">Diese Woche</div><div class="week-chart">`;
  wk.forEach((v,i)=>{const ht=Math.max(4,Math.round(v/maxD*90));h+=`<div class="week-col"><div class="week-val">${v}</div><div class="week-bar" style="height:${ht}px"></div><div class="week-day">${days[i]}</div></div>`});
  h+=`</div></div>`;
  h+=`<div class="section-card"><div class="section-title">Offene nach Priorität</div><div class="prio-cards"><div class="prio-card" style="border-left-color:#ef5350"><div class="prio-num">${prio.high}</div><div class="prio-label">🔴 Hoch</div></div><div class="prio-card" style="border-left-color:#ffa726"><div class="prio-num">${prio.medium}</div><div class="prio-label">🟡 Mittel</div></div><div class="prio-card" style="border-left-color:#66bb6a"><div class="prio-num">${prio.low}</div><div class="prio-label">🟢 Niedrig</div></div></div></div>`;
  if(done>0)h+=`<div class="insight">Du hast schon ${done} Aufgaben geschafft! 💪<br>${done>10?'Absolute Maschine!':'Weiter so!'}</div>`;
  screen.innerHTML=h;
}

// PROFILE
function renderProfile(){
  const c=cats();const learned=Object.entries(S.learned||{});
  let h=`<div class="screen-header"><div class="screen-title">🧘 Ich</div></div>`;
  h+=`<div class="profile-card"><div class="avatar">L</div><div class="profile-name">Luisa</div><div class="profile-sub">${S.tasks.filter(t=>t.done).length} Aufgaben geschafft</div></div>`;
  h+=`<div class="section-card"><div class="section-title">Kategorien</div>`;
  for(const[k,v]of Object.entries(c)){h+=`<div class="cat-row"><div class="cat-dot" style="background:${v.color}"></div>${v.emoji} ${v.name}</div>`}
  h+=`<button class="mgmt-btn" id="cat-mgmt">⚙️ Kategorien verwalten</button></div>`;
  h+=`<div class="section-card"><div class="section-title">Intelligenz</div><div style="font-size:13px;color:var(--muted);margin-bottom:8px">Die App hat ${learned.length} Wörter von dir gelernt.</div>`;
  if(learned.length){h+=`<div class="learned-chips">`;learned.slice(0,10).forEach(([w,cat])=>{h+=`<span class="learned-chip">${c[cat]?.emoji||'📌'} ${w}</span>`});if(learned.length>10)h+=`<span class="learned-chip">+${learned.length-10} weitere</span>`;h+=`</div>`;h+=`<button class="danger-btn" id="clear-learn">Gelerntes vergessen</button>`}
  h+=`</div>`;
  h+=`<div class="section-card"><div class="section-title">Daten</div><button class="mgmt-btn" id="export-btn">📤 Daten exportieren</button></div>`;
  screen.innerHTML=h;

  $('cat-mgmt').onclick=openCatManager;
  const cl=$('clear-learn');if(cl)cl.onclick=()=>{if(confirm('Alle gelernten Zuordnungen löschen?')){S.learned={};save();render()}};
  $('export-btn').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='luisa-todo-backup.json';a.click()};
}

function openCatManager(){
  const c=cats();let editing={};
  for(const[k,v]of Object.entries(c))editing[k]={...v};
  renderCatModal(editing);
}

function renderCatModal(editing){
  let h=`<div class="modal" onclick="event.stopPropagation()">`;
  h+=`<div class="modal-header"><div class="modal-title">Kategorien verwalten</div><div class="modal-close" id="mc">✕</div></div>`;
  h+=`<div id="cat-list">`;
  for(const[k,v]of Object.entries(editing)){
    h+=`<div class="cat-edit-row"><div class="emoji-btn" data-emo="${k}">${v.emoji}</div><input class="cat-name-input" data-cn="${k}" value="${esc(v.name)}"><div class="color-btn" style="background:${v.color}" data-col="${k}"></div>`;
    if(Object.keys(editing).length>1)h+=`<div class="del-cat" data-dc="${k}">✕</div>`;
    h+=`</div><div id="emo-pick-${k}" style="display:none"></div><div id="col-pick-${k}" style="display:none"></div>`;
  }
  h+=`</div>`;
  h+=`<button class="add-cat-btn" id="add-cat">+ Neue Kategorie</button>`;
  h+=`<button class="save-btn" id="save-cats">✓ Speichern</button></div>`;
  modal.innerHTML=h;modal.classList.add('show');

  $('mc').onclick=closeModal;modal.onclick=closeModal;

  // Emoji pickers
  modal.querySelectorAll('[data-emo]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.emo;const el=$('emo-pick-'+k);
    if(el.style.display!=='none'){el.style.display='none';return}
    modal.querySelectorAll('[id^=emo-pick-],[id^=col-pick-]').forEach(x=>x.style.display='none');
    el.innerHTML=`<div class="picker-grid">${CAT_EMOJIS.map(e=>`<div class="picker-item" data-pe="${k}" data-em="${e}">${e}</div>`).join('')}</div>`;
    el.style.display='block';
    el.querySelectorAll('[data-pe]').forEach(p=>p.onclick=()=>{editing[k].emoji=p.dataset.em;el.style.display='none';renderCatModal(editing)});
  });

  // Color pickers
  modal.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.col;const el=$('col-pick-'+k);
    if(el.style.display!=='none'){el.style.display='none';return}
    modal.querySelectorAll('[id^=emo-pick-],[id^=col-pick-]').forEach(x=>x.style.display='none');
    el.innerHTML=`<div class="color-grid">${CAT_COLORS.map(c=>`<div class="color-swatch ${editing[k].color===c?'sel':''}" style="background:${c}" data-pc="${k}" data-cv="${c}"></div>`).join('')}</div>`;
    el.style.display='block';
    el.querySelectorAll('[data-pc]').forEach(p=>p.onclick=()=>{editing[k].color=p.dataset.cv;el.style.display='none';renderCatModal(editing)});
  });

  // Name changes
  modal.querySelectorAll('[data-cn]').forEach(i=>i.addEventListener('input',()=>{editing[i.dataset.cn].name=i.value}));

  // Delete
  modal.querySelectorAll('[data-dc]').forEach(d=>d.onclick=()=>{delete editing[d.dataset.dc];renderCatModal(editing)});

  // Add
  $('add-cat').onclick=()=>{const id='cat_'+Date.now();editing[id]={emoji:'📌',color:CAT_COLORS[Object.keys(editing).length%CAT_COLORS.length],name:'Neu'};renderCatModal(editing)};

  // Save
  $('save-cats').onclick=()=>{
    const final={};
    for(const[k,v]of Object.entries(editing)){const n=(v.name||'Neu').trim();final[k]={emoji:v.emoji,color:v.color,name:n}}
    S.cats=final;save();closeModal();render();
  };
}

// UTILS
function closeModal(){modal.classList.remove('show');setTimeout(()=>modal.innerHTML='',300)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(s){if(!s)return'';const d=new Date(s);const m=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];return d.getDate()+'. '+m[d.getMonth()]}

// TAB SWITCHING
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');curTab=t.dataset.tab;
  filterCat='';filterPrio='';showDone=false;
  render();screen.scrollTop=0;
});

// INIT
load();render();
</script>
</body>
</html>
